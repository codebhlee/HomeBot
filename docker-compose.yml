services:
  postgres:
    image: postgres:16-alpine
    container_name: homebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       homebot
      POSTGRES_USER:     homebot
      POSTGRES_PASSWORD: homebot_password
    ports:
      - "5432:5432"
    volumes:
      - ./Data/postgres:/var/lib/postgresql/data
      - ./Data/init:/docker-entrypoint-initdb.d:ro
    Command:
      # 대용량 처리를 위한 튜닝 파라미터 (선택사항)
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "password_encryption=md5"  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homebot -d homebot"]
      interval: 10s
      timeout: 5s
      retries: 5
